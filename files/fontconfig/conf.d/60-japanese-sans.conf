<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- sans-serif の日本語は 99-japanese.conf で Noto Sans CJK JP に解決される。
       ここでは GTK/Qt の既定 UI フォント (Adwaita Sans, CJK グリフなし) の
       フォールバックだけ面倒を見る。UDEV Gothic NF は等幅なので UI/ブラウザの
       本文には使わない (monospace は fonts.conf 側で omarchy font set が管理)。 -->
  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK JP</string></edit>
  </match>
</fontconfig>

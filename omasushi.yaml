name: omakase
description: polidog's personal Omarchy setup.
packages:
  aur:
    - claude-desktop
    - google-chrome
    - google-cloud-cli
    - hyprmoncfg
    - rtk-bin
    - slack-desktop
    - ttf-hackgen
    - ttf-udev-gothic
omarchy:
  font: UDEV Gothic NF
  defaults:
    agent: codex
    browser: chrome
    editor: nvim
    terminal: kitty
  plugins:
    - url: https://github.com/Charlieras262/omarchy-pill-workspaces.git
      enable: true
    - url: https://github.com/crmne/omarchy-hyprmoncfg.git
      enable: true
    - url: https://github.com/devgtv/omarchy-docker.git
      enable: true
    - url: https://github.com/fabean/omarchy-herdr.git
      enable: true
    - url: https://github.com/polidog/omasushi.git
      enable: true
    - url: https://github.com/rmacy/omarchy-system-monitor.git
      enable: true
    - url: https://github.com/tmn73/omarchy-calendar.git
      enable: true
herdr:
  plugins:
    - source: polidog/herdr-gh-issue-label
    - source: szrenwei/herdr-agent-metrics
claude:
  skills: skills
  commands: commands
files:
  files/hypr/bindings.lua: ~/.config/hypr/bindings.lua
  files/bin/herdr-prefix-ime-off: ~/.local/bin/herdr-prefix-ime-off   # used by the CTRL+B binding
  files/herdr/config.toml: ~/.config/herdr/config.toml
  files/kitty/kitty.conf: ~/.config/kitty/kitty.conf
  files/foot/foot.ini: ~/.config/foot/foot.ini
  files/tmux/tmux.conf: ~/.config/tmux/tmux.conf
  files/starship.toml: ~/.config/starship.toml
  files/git/config: ~/.config/git/config
  files/git/ignore: ~/.config/git/ignore
  files/omarchy/shell.json: ~/.config/omarchy/shell.json
  files/omarchy/hooks/post-update.d/install-voxtype.hook: ~/.config/omarchy/hooks/post-update.d/install-voxtype.hook
  files/omarchy/hooks/post-update.d/setup-agent.hook: ~/.config/omarchy/hooks/post-update.d/setup-agent.hook
  files/omarchy/hooks/post-update.d/setup-fingerprint.hook: ~/.config/omarchy/hooks/post-update.d/setup-fingerprint.hook
  files/fontconfig/conf.d: ~/.config/fontconfig/conf.d
  files/nvim: ~/.config/nvim

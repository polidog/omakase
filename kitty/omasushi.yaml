# kitty as the terminal. kitty.conf names UDEV Gothic NF, which the fonts
# pack installs. `omarchy font set` / `theme set` rewrite kitty.conf in place
# and break the symlink - copy it back in and sync again when that happens.
description: kitty as the terminal, with the fonts pack it wants
use: [../fonts]
omarchy:
  defaults:
    terminal: kitty
files:
  files/kitty/kitty.conf: ~/.config/kitty/kitty.conf

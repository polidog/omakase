<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Prefer Japanese glyph variants of Noto CJK</description>

  <!-- Noto CJK ships JP/KR/SC/TC faces that share one charset, so plain
       charset matching lands on whichever sorts first (KR) and renders kanji
       with Korean glyph forms. These rules pin the JP faces.

       Lives in conf.d/ rather than fonts.conf because `omarchy font set`
       overwrites ~/.config/fontconfig/fonts.conf wholesale.

       Loaded via 50-user.conf, which sorts AFTER 50-omarchy.conf. By then
       Omarchy has already `assign`ed sans-serif -> Liberation Sans and
       serif -> Liberation Serif, so the generic name is gone from the
       pattern and each rule below has to test the resolved family too. -->

  <!-- Japanese-tagged sans text -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family" qual="any"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <!-- Japanese-tagged serif text -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family" qual="any"><string>Liberation Serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <!-- Monospace is only ever appended, never prepended: the terminal font
       stays primary for latin and only unmapped CJK codepoints fall through
       to the JP face, so column alignment is untouched. Uses the generic
       name, which survives here because Omarchy's monospace assignment is
       what `omarchy font set` rewrites. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <!-- Chromium and Electron resolve missing glyphs one codepoint at a time
       with no lang on the pattern, so none of the rules above fire for them
       and fontconfig falls through to a raw charset scan that lands on the KR
       face. Naming the JP face as a last-resort family covers that path.
       Appended, so it never displaces a family the app actually asked for,
       and charset matching still outranks family matching: latin, emoji and
       Nerd Font glyphs resolve exactly as before. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
</fontconfig>
